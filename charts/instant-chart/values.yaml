## Override the default chart name
##
nameOverride: ""

## Global config will apply to all resources
##
global:
  ## Add `app.kubernetes.io/version` label
  ##
  appVersion: ""

  ## Add additional labels
  ##
  labels: {}

  ## Add additional annotations
  ##
  annotations: {}

  ## Default storage class
  ##
  defaultStorageClass: ""

  ## Global image pull secrets
  ##
  imagePullSecrets: []

## Kind of resource
##
kind: Deployment

## Number of pod replicas
##
replicas: 1

## Patch container images for using FluxCD HelmRelease.
## E.g.
## imagePatches:
##   my-container: my-image:debian
imagePatches: {}

## A list of containers belonging to the pod
## E.g.
## containers:
##   - name: "my-container"
##     image: "my-image:latest"
##     ports:
##       - containerPort: 80
##     volumeMounts:
##       - name: "my-volume"
##         mountPath: "/data"
##         subPath: "my-subpath"
##         readOnly: true
##     livenessProbe:
##       enabled: true
containers: []

## Additional initialization containers
##
initContainers: []

## Pod restart policy
##
restartPolicy: ""

## A list of volumes to be added to the pod
## E.g.
## volumes:
##   - name: "mydata"
##     persistentVolumeClaim:
##       claimName: "mypvcname"
##       requests:
##         size: 10Gi
##         storageClass: "standard"
##         accessModes: ["ReadWriteOnce"]
##   - name: "myconfig"
##     configMap:
##       name: "myconfigmapname"
##   - name: "mycredentials"
##     configMap:
##       name: "mysecretname"
volumes: []

## Service Account for Pod to use.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
##
serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}

## Reference to one or more secrets to be used when pulling images
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
## E.g.
## imagePullSecrets:
##   - myRegistryKeySecretName
imagePullSecrets: []

## Create a Secret to provides the registry credentials for pulling private images
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
## E.g.
## registryLogin:
##   - server: "https://my.private.registry/v1/"
##     username: "myuser"
##     password: "mypassword"
##     email: ""
registryLogin: []

## Assign custom affinity rules to the prometheus instance
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
##
affinity: {}

## Define which Nodes the Pods are scheduled on.
## ref: https://kubernetes.io/docs/user-guide/node-selection/
## E.g.
## nodeSelector:
##   kubernetes.io/os: linux
nodeSelector: {}

## Assign Pods to a specific node name
##
nodeName: ""

## Tolerations for use with node taints
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
## E.g.
## tolerations:
##   - key: "example-key"
##     operator: "Exists"
##     effect: "NoSchedule"
tolerations: []

## Enable topology spread constraints to control how Pods are spread across your cluster among failure-domains
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
##
topologySpreadConstraints: []

## Define privilege and access control settings for a Pod or Container
##
securityContext: {}

## DNS configuration for the pod
##
dnsConfig: {}

## Host aliases for the pod
##
hostAliases: []

## Overhead for the pod
##
overhead: {}

## Readiness gates for the pod
##
readinessGates: []

## Service configuration
##
service:
  enabled: true

  ## The type of the service (ClusterIP, NodePort, LoadBalancer, ExternalName)
  ##
  type: ClusterIP

  ## The ports that the service should expose. If .service.ports is empty,
  ## the first container port of the first container will be used for both `port` and `targetPort`.
  ## E.g.
  ## ports:
  ##   - name: http
  ##     port: 80
  ports: []

  ## Annotations to add to the service
  ##
  annotations: {}

  ## Add additional fields to the service spec: externalName, externalIPs, .etc.
  ##
  ## externalName: ""
  ## externalIPs: []

## Ingress configuration
## ref https://kubernetes.io/docs/concepts/services-networking/ingress
##
ingress:
  enabled: false

  ## Ingress class name
  ## https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class.
  ##
  className: "nginx"

  ## Optionally specify additional annotations to the ingress.
  ## E.g.
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   kubernetes.io/tls-acme: "true"
  annotations: {}

  ## The list of rules for the ingress. K8s PathType ares: ImplementationSpecific, Prefix, Exact
  ## E.g.
  ## rules:
  ##   - host: chart-example.local
  ##     paths: # optional
  ##       - path: / # optional, default: /
  ##         pathType: ImplementationSpecific # optional, default is `ImplementationSpecific`
  ##         servicePort: 80 # optional, default the first port in Service definition
  ##         serviceName: "" # optional, override the generated service name
  rules: []

  ## Ingress TLS configuration
  ## E.g.
  ## tls:
  ##   - secretName: chart-example-tls
  ##     hosts:
  ##       - chart-example.local
  tls: []

## Gateway API HTTPRoute configuration
## Requires the Gateway API CRDs (v1.0+) and a Gateway controller installed in the cluster.
## ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
##
httpRoute:
  enabled: false

  ## Optionally specify additional annotations to the HTTPRoute.
  ##
  annotations: {}

  ## The Gateways this route attaches to. Required when `httpRoute.enabled` is true.
  ## E.g.
  ## parentRefs:
  ##   - name: public-gateway
  ##     namespace: gateway-system # optional, default: the release namespace
  ##     sectionName: https # optional, attach to a specific listener of the Gateway
  parentRefs: []

  ## Hostnames matched against the HTTP Host header.
  ## E.g.
  ## hostnames:
  ##   - chart-example.local
  hostnames: []

  ## The list of HTTPRoute rules. If empty, all requests are routed to the Service of this chart.
  ## Each rule accepts every HTTPRouteRule field: matches, filters, timeouts, .etc.
  ## A rule without `backendRefs` is routed to the Service of this chart, except a rule with
  ## a `RequestRedirect` filter. Set `backendRefs: []` to render a rule without backends.
  ## E.g.
  ## rules:
  ##   - matches:
  ##       - path:
  ##           type: PathPrefix # PathPrefix, Exact, RegularExpression
  ##           value: /api
  ##     filters: [] # optional
  ##     backendRefs: # optional, default: the Service of this chart
  ##       - name: "" # optional, default: the Service of this chart. A named backend is rendered as-is
  ##         port: 80 # optional when `name` is empty, default the first port in Service definition
  ##         weight: 1 # optional
  ##   - filters: # redirect HTTP to HTTPS, no backend is added
  ##       - type: RequestRedirect
  ##         requestRedirect:
  ##           scheme: https
  ##           statusCode: 301
  rules: []

## NetworkPolicies to create, keyed by policy name. Each NetworkPolicy is named `<release name>-<key>`.
## Requires a network plugin that enforces NetworkPolicy, e.g. Calico or Cilium.
## ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
## Each value is a NetworkPolicy spec: podSelector, policyTypes, ingress, egress.
## `podSelector` defaults to the Pods of this chart; set `podSelector: {}` to select all Pods in the namespace.
## `egress` requires `policyTypes` with `Egress`, otherwise Kubernetes would not enforce it.
## Policy keys must be lowercase alphanumerics and `-`. Set a policy to null in another values file to remove it.
## E.g.
## networkPolicies:
##   allow-ingress-controller: # only the ingress controller can reach the app on port 8080
##     policyTypes: [Ingress]
##     ingress:
##       - from:
##           - namespaceSelector:
##               matchLabels:
##                 kubernetes.io/metadata.name: ingress-nginx
##         ports:
##           - port: 8080
##   allow-dns-egress: # deny all egress except DNS lookups
##     policyTypes: [Egress]
##     egress:
##       - to:
##           - namespaceSelector:
##               matchLabels:
##                 kubernetes.io/metadata.name: kube-system
##         ports:
##           - port: 53
##             protocol: UDP
##           - port: 53
##             protocol: TCP
networkPolicies: {}

## List of ConfigMaps to create, for storing non-sensitive data
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
## E.g.
## configMaps:
##   myappconfig:
##     APP_ENV: "production"
##     APP_NAME: "myapp"
configMaps: {}

## List of Secrets to create, for storing sensitive data
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
## E.g.
## secrets:
##   googlecreds:
##     googlecredentials.json: |-
##       {"fake":"json"}
##   myappsecret:
##     APP_KEY: "mysecretkey"
##     DATABASE_URL: "postgres://user:password@host:port/dbname"
secrets: {}

## The update strategy for Deployment, DaemonSet, StatefulSet
## E.g.
## updateStrategy:
##   type: RollingUpdate
##   rollingUpdate:
##     maxSure: 25%
##     maxUnavailable: 25%
updateStrategy: {}

## The StatefulSet configuration
##
statefulSet:
  ordinals: {}
  serviceName: ""
  podManagementPolicy: ""
  persistentVolumeClaimRetentionPolicy: {}
  volumeClaimTemplates: {}

## The cronjob configuration
##
cronJob:
  ## The schdule in Cron format
  ## https://en.wikipedia.org/wiki/Cron
  ## E.g.
  ## * * * * *
  ## | | | | |
  ## | | | | day of the week (0–6) (Sunday to Saturday;
  ## | | | month (1–12)             7 is also Sunday on some systems)
  ## | | day of the month (1–31)
  ## | hour (0–23)
  ## minute (0–59)
  schedule: "* * * * *"

  ## The time zone name for the given schedule
  ## https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  ##
  timeZone: ""
  concurrencyPolicy: Allow
  # startingDeadlineSeconds: 0

  ## Job spec
  ##
  # backoffLimit: <integer>
  # backoffLimitPerIndex: <integer>
  # parallelism: <integer>
  # completions: <integer>
  # activeDeadlineSeconds: <integer>
  # completionMode: Indexed / NonIndexed
  # manualSelector: <boolean>
  # maxFailedIndexes: <integer>
  # podFailurePolicy: {}
  # podReplacementPolicy: Failed / TerminatingOrFailed
  # ttlSecondsAfterFinished: <integer>
