{{- range $name, $policy := .Values.networkPolicies }}
{{- /* A policy set to null in a later values file is removed */}}
{{- if kindIs "map" $policy }}
{{- $spec := deepCopy $policy }}
{{- if not (hasKey $spec "podSelector") }}
{{- $_ := set $spec "podSelector" (dict "matchLabels" (include "instant-chart.matchLabels" $ | fromYaml)) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "instant-chart.labels" $ | nindent 4 }}
  {{- with $.Values.global.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
